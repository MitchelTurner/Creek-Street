[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start -w @creek-street/api"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"

# Single service serves Nest API (/api/*) + Vite SPA (/*).
# Railway sets PORT; the container listens on 0.0.0.0:$PORT.
# Optional: Postgres (PostGIS) + Redis when leaving memory-store mode.
