<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="As built wood sign conditions">
  <rect width="640" height="400" fill="#0e1c1c"/>
  <rect x="40" y="40" width="280" height="320" rx="4" fill="#5c3a24"/>
  <rect x="60" y="70" width="240" height="160" fill="#d8c4a8"/>
  <rect x="90" y="120" width="180" height="48" fill="#8a5a3a"/>
  <text x="180" y="150" fill="#e7f1ef" font-family="Georgia, serif" font-size="18" text-anchor="middle">WOOD SIGN</text>
  <text x="400" y="180" fill="#b08a4a" font-family="Georgia, serif" font-size="28">Conditions</text>
  <text x="400" y="220" fill="#c5d8d4" font-family="sans-serif" font-size="14">Wood substrate</text>
  <text x="400" y="245" fill="#c5d8d4" font-family="sans-serif" font-size="14">No plastic face</text>
  <text x="400" y="270" fill="#c5d8d4" font-family="sans-serif" font-size="14">Hardware matches siding</text>
