services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: creek
      POSTGRES_PASSWORD: creek
      POSTGRES_DB: creek_street
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
